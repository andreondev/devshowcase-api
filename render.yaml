services:
  - type: web
    name: devshowcase-api
    env: docker
    plan: free
    region: ohio
    healthCheckPath: /api/projects
    envVars:
      - key: DB_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USER
        fromDatabase:
          name: devshowcase-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: devshowcase-db
          property: password
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect

databases:
  - name: devshowcase-db
    plan: free
    region: ohio
    databaseName: devshowcase
    user: devuser
